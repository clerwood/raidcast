name: release

# Tag-driven. `git tag v0.2.0 && git push --tags` is the entire release ritual.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake --preset windows "-DRAIDCAST_VERSION=${{ steps.ver.outputs.version }}"

      - name: Build
        run: cmake --build --preset windows

      - name: Test
        run: ctest --preset windows

      - name: Stage install tree
        run: cmake --install build/windows --config RelWithDebInfo --prefix staging

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path staging/* -DestinationPath raidcast-${{ steps.ver.outputs.version }}-win64.zip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.ver.outputs.version }}
          /DStageDir=${{ github.workspace }}\staging
          installer\raidcast.iss

      # NOTE: artifacts are unsigned, so SmartScreen will warn on first run.
      # Deferred deliberately — see .local/DESIGN.md §12.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            raidcast-${{ steps.ver.outputs.version }}-win64.zip
            installer/Output/*.exe
